name: Build Windows app
permissions:
  contents: write
on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: |
          set +e
          npm run typecheck > ../tc.log 2>&1
          echo $? > ../tc.status
          cat ../tc.log | head -60
          grep -E "error TS" ../tc.log | head -60 > ../errors.txt
          gh release delete desktop-buildlog -y --cleanup-tag || true
          if [ -s ../errors.txt ]; then gh release create desktop-buildlog --title "desktop type errors" --notes-file ../errors.txt; else gh release create desktop-buildlog --title "desktop ok" --notes "no type errors"; fi
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Package
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: homit-windows
          path: desktop/release/*.exe
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest -y --cleanup-tag || true
          gh release create desktop-latest release/*.exe --title "HoMit for Windows" --notes "Download the .exe installer and run it."
