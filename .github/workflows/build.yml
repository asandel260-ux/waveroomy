name: Build APK
permissions:
  contents: write
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain > build.log 2>&1
          echo $? > status.txt
          if [ "$(cat status.txt)" != "0" ]; then
            grep -E "^e: |What went wrong|error:" build.log | head -80 > errors.txt
            gh release delete buildlog -y --cleanup-tag || true
            gh release create buildlog --title "build errors" --notes-file errors.txt
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: waveroom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Waveroom.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Waveroom.apk --title "Waveroom (debug APK)" --notes "Install on Android: download Waveroom.apk and open it."
